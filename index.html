<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#000000">

    <title>DEMOCRACY OF THE DEAD</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family:
                Arial,
                "Noto Sans JP",
                sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
        }

        /* =====================================================
           GAME CONTAINER
           ===================================================== */

        #game-container {
            width: 100%;
            max-width: 960px;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            background: #000;
        }

        /* =====================================================
           TITLE
           ===================================================== */

        #game-title {
            width: 100%;
            padding: 14px 10px 8px;

            text-align: center;

            color: #fff;
            font-size: clamp(18px, 4vw, 28px);
            font-weight: bold;
            letter-spacing: 2px;

            text-shadow:
                0 0 5px #fff,
                0 0 10px #888;
        }

        /* =====================================================
           PYXEL GAME
           ===================================================== */

        #game-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 5px;
        }

        pyxel-run {
            display: block;

            width: 100%;
            max-width: 800px;

            margin: 0 auto;

            background: #000;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;

            display: block;

            margin: 0 auto;

            max-width: 100%;
            height: auto;

            background: #000;
        }

        /* =====================================================
           VIDEO
           ===================================================== */

        #ending-movie-container {

            display: none;

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            z-index: 9999;

            background: #000;

            align-items: center;
            justify-content: center;
        }

        #ending-movie {

            width: 100%;
            height: 100%;

            max-width: 100vw;
            max-height: 100vh;

            object-fit: contain;

            background: #000;
        }

        /* =====================================================
           CLOSE BUTTON
           ===================================================== */

        #movie-close {

            position: fixed;

            right: 15px;
            top: 15px;

            z-index: 10000;

            width: 42px;
            height: 42px;

            border: 2px solid #fff;
            border-radius: 50%;

            background: rgba(0,0,0,0.7);

            color: #fff;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            display: none;
        }

        #movie-close:hover {
            background: rgba(255,255,255,0.2);
        }

        /* =====================================================
           INFORMATION
           ===================================================== */

        #info {

            width: 100%;
            max-width: 800px;

            padding: 12px 15px 30px;

            text-align: center;

            color: #aaa;

            font-size: 13px;
            line-height: 1.7;
        }

        #info strong {
            color: #fff;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            #game-title {
                font-size: 18px;
                padding-top: 10px;
            }

            #game-area {
                padding: 0;
            }

            #info {
                font-size: 12px;
            }

        }

    </style>
</head>


<body>

<div id="game-container">

    <div id="game-title">
        DEMOCRACY OF THE DEAD
    </div>


    <!-- =====================================================
         PYXEL GAME
         ===================================================== -->

    <div id="game-area">

        <pyxel-run
            root="."
            name="DODkasnihonngopy_エンドロール完全修正版.py"
            gamepad="enabled">
        </pyxel-run>

    </div>


    <div id="info">

        <strong>DEMOCRACY OF THE DEAD</strong><br>

        方向キー / ゲームパッドで操作してください。<br>

        ゾンビを捕獲して聖域へ連れて行こう。

    </div>

</div>


<!-- =========================================================
     ENDING MOVIE
     ========================================================= -->

<div id="ending-movie-container">

    <video
        id="ending-movie"
        playsinline
        preload="auto">
    </video>

    <button
        id="movie-close"
        onclick="closeEndingMovie()">
        ×
    </button>

</div>


<script
    src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js">
</script>


<script>

    /* =========================================================
       ENDING MOVIE SYSTEM
       ========================================================= */

    let currentMovie = null;


    function showEndingMovie(filename) {

        console.log(
            "DEMOCRACY OF THE DEAD movie:",
            filename
        );


        const container =
            document.getElementById(
                "ending-movie-container"
            );

        const video =
            document.getElementById(
                "ending-movie"
            );

        const closeButton =
            document.getElementById(
                "movie-close"
            );


        /*
         * GitHub Pages上の現在のページを基準に
         * 動画ファイルの場所を決定
         */

        const moviePath =
            new URL(
                filename,
                window.location.href
            ).href;


        currentMovie = moviePath;


        /*
         * Pyxel画面の上に動画を表示
         */

        container.style.display = "flex";

        closeButton.style.display = "block";


        /*
         * 動画をセット
         */

        video.pause();

        video.currentTime = 0;

        video.src = moviePath;

        video.load();


        /*
         * 再生開始
         */

        const playPromise =
            video.play();


        if (playPromise !== undefined) {

            playPromise.catch(
                function(error) {

                    console.log(
                        "Autoplay blocked:",
                        error
                    );

                }
            );

        }

    }


    /* =========================================================
       VIDEO END
       ========================================================= */

    document
        .getElementById("ending-movie")
        .addEventListener(
            "ended",
            function() {

                closeEndingMovie();

            }
        );


    /* =========================================================
       CLOSE MOVIE
       ========================================================= */

    function closeEndingMovie() {

        const container =
            document.getElementById(
                "ending-movie-container"
            );

        const video =
            document.getElementById(
                "ending-movie"
            );

        const closeButton =
            document.getElementById(
                "movie-close"
            );


        video.pause();

        video.removeAttribute("src");

        video.load();


        container.style.display = "none";

        closeButton.style.display = "none";

    }


    /* =========================================================
       PYXELから呼び出せるようにグローバル登録
       ========================================================= */

    window.showEndingMovie =
        showEndingMovie;


    /* =========================================================
       DEBUG
       ========================================================= */

    window.addEventListener(
        "error",
        function(event) {

            console.error(
                "JavaScript Error:",
                event.error || event.message
            );

        }
    );

</script>


</body>

</html>
