<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACY OF THE DEAD</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 動画ガチャ用のオーバーレイ */
        #movie-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <!-- Pyxel Web 実行スクリプト -->
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js" script="main.py"></script>

    <!-- 動画ガチャ再生用コンテナ -->
    <div id="movie-container">
        <video id="ending-video" playsinline muted></video>
    </div>

    <script>
        // Python側 (main.py) の js.showEndingMovie から呼び出される関数
        window.showEndingMovie = function(filename) {
            const container = document.getElementById('movie-container');
            const video = document.getElementById('ending-video');
            
            container.style.display = 'flex';
            video.src = filename;
            video.play().catch(e => {
                console.log("動画の自動再生がブロックされました:", e);
            });

            video.onended = function() {
                container.style.display = 'none';
                video.src = "";
            };
        };
    </script>

</body>
</html>
