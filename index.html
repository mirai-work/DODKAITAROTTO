<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">
    <title>DEMOCRACY OF THE DEAD</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family:
                "Yu Gothic",
                "Meiryo",
                sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #game-container {
            width: 160px;
            margin-top: 20px;
            position: relative;
        }

        /* Pyxel本体 (3倍表示) */
        pyxel-run {
            display: block;
            width: 480px;
            height: 360px;
            transform-origin: top left;
        }

        /* タイトル・ゲーム説明 */
        #game-title {
            margin-top: 390px;
            text-align: center;
            width: 100%;
        }

        #game-title h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }

        #game-title p {
            margin-top: 8px;
            color: #aaa;
            font-size: 13px;
        }

        /* エンディング動画 */
        #ending-movie-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        #ending-movie {
            display: block;
            width: min(90vw, 800px);
            max-height: 90vh;
            object-fit: contain;
            background: #000;
        }

        /* 動画終了後の黒画面 */
        #movie-blackout {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            z-index: 100000;
        }

        /* 閉じるボタン */
        #movie-close {
            position: fixed;
            right: 15px;
            top: 15px;
            width: 40px;
            height: 40px;
            border: 1px solid #777;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: none;
            z-index: 100001;
        }

        #movie-close:hover {
            background: rgba(80, 80, 80, 0.8);
        }

        /* スマートフォン対応 */
        @media (max-width: 600px) {
            #game-container {
                margin-top: 10px;
            }

            pyxel-run {
                width: 320px;
                height: 240px;
            }

            #game-title {
                margin-top: 260px;
            }

            #game-title h1 {
                font-size: 18px;
            }

            #ending-movie {
                width: 96vw;
                max-height: 85vh;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- name属性を main.py に修正 -->
        <pyxel-run
            id="pyxel-game"
            root="./"
            name="main.py">
        </pyxel-run>
    </div>

    <div id="game-title">
        <h1>DEMOCRACY OF THE DEAD</h1>
        <p>© MIRAI WORK / Y.K / M.T 2026</p>
    </div>

    <!-- エンディング動画表示領域 -->
    <div id="ending-movie-container">
        <video
            id="ending-movie"
            playsinline
            preload="auto">
        </video>
    </div>

    <div id="movie-blackout"></div>

    <button id="movie-close" type="button">×</button>

    <!-- Pyxel Web Runtime -->
    <script type="module"
            src="https://cdn.jsdelivr.net/gh/kitao/pyxel@latest/wasm/pyxel.js">
    </script>

    <!-- JavaScript -->
    <script>
        let moviePlaying = false;

        function showEndingMovie(filename) {
            console.log("DEMOCRACY OF THE DEAD: ENDING MOVIE:", filename);

            const container = document.getElementById("ending-movie-container");
            const video = document.getElementById("ending-movie");
            const closeButton = document.getElementById("movie-close");

            const moviePath = "./" + filename;
            moviePlaying = true;

            container.style.display = "flex";
            closeButton.style.display = "block";

            video.pause();
            video.currentTime = 0;
            video.src = moviePath;
            video.load();
            video.muted = false;

            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Autoplay blocked:", error);
                    video.controls = true;
                });
            }
        }

        function finishEndingMovie() {
            const container = document.getElementById("ending-movie-container");
            const video = document.getElementById("ending-movie");
            const closeButton = document.getElementById("movie-close");

            video.pause();
            video.removeAttribute("src");
            video.load();

            container.style.display = "none";
            closeButton.style.display = "none";
            moviePlaying = false;

            if (window.pyxel_app && typeof window.pyxel_app.movie_finished === "function") {
                window.pyxel_app.movie_finished();
            }
        }

        document.getElementById("ending-movie").addEventListener("ended", function() {
            finishEndingMovie();
        });

        document.getElementById("ending-movie").addEventListener("error", function() {
            console.error("Ending movie could not be loaded.");
            setTimeout(function() {
                finishEndingMovie();
            }, 500);
        });

        document.getElementById("movie-close").addEventListener("click", function() {
            finishEndingMovie();
        });

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape" && moviePlaying) {
                finishEndingMovie();
            }
        });

        window.showEndingMovie = showEndingMovie;

        console.log("DEMOCRACY OF THE DEAD Web Runtime Ready");
    </script>

</body>
</html>
