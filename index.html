<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEMOCRACY OF THE DEAD</title>

    <!-- =====================================================
         PYXEL WEB
         ================================================     -->
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pyxelゲーム画面 */
        pyxel-run {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* =====================================================
           ENDING MOVIE
           ===================================================== */
        #endingMovie {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
            z-index: 99999;
        }
    </style>
</head>

<body>

    <!-- =====================================================
         PYXEL GAME
         ※ name属性は実際のPythonファイル名に合わせて変更してください
         ================================================     -->
    <pyxel-run
        root="."
        name="DODkasnihonngopy_gacya01.py"
        gamepad="enabled">
    </pyxel-run>

    <script>
    /* =========================================================
       ENDING MOVIE (ガチャ動画再生用ハンドラー)
       ========================================================= */
    window.showEndingMovie = function(name) {
        console.log("[DOD] showEndingMovie:", name);

        /* 既存の動画要素があれば削除 */
        const oldVideo = document.getElementById("endingMovie");
        if (oldVideo) {
            oldVideo.pause();
            oldVideo.remove();
        }

        /* ファイル名の正規化 (.mp4の補完) */
        let filename = String(name);
        if (!filename.toLowerCase().endsWith(".mp4")) {
            filename += ".mp4";
        }

        /* GitHub Pagesやローカル環境のURL基準を生成 */
        const movieURL = new URL(filename, window.location.href).href;
        console.log("[DOD] movie URL:", movieURL);

        /* VIDEO要素の動的生成 */
        const video = document.createElement("video");
        video.id = "endingMovie";
        video.src = movieURL;
        video.autoplay = true;
        video.controls = false;
        video.muted = false;
        video.playsInline = true;
        video.preload = "auto";
        video.setAttribute("playsinline", "");

        /* スタイル設定 */
        video.style.position = "fixed";
        video.style.left = "0";
        video.style.top = "0";
        video.style.width = "100vw";
        video.style.height = "100vh";
        video.style.objectFit = "contain";
        video.style.background = "#000";
        video.style.zIndex = "99999";

        /* DOMへ追加して再生開始 */
        document.body.appendChild(video);
        console.log("[DOD] movie element created");

        /* 動画終了時の処理 */
        video.onended = function() {
            console.log("[DOD] movie ended");
            video.pause();
            video.remove();

            /* Python側（タイトル画面への復帰）へ通知 */
            if (window.pyxel_app && typeof window.pyxel_app.movie_finished === "function") {
                console.log("[DOD] return to title");
                window.pyxel_app.movie_finished();
            }
        };

        /* 動画読み込みエラー時の処理（ゲームを止めないためのフォールバック） */
        video.onerror = function() {
            console.error("[DOD] movie load error:", movieURL);
            video.remove();

            if (window.pyxel_app && typeof window.pyxel_app.movie_finished === "function") {
                window.pyxel_app.movie_finished();
            }
        };

        /* 自動再生ポリシー対策つきの再生処理 */
        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(function(error) {
                console.warn("[DOD] autoplay blocked, trying muted:", error);
                video.muted = true;
                video.play().catch(function(error2) {
                    console.error("[DOD] video play failed completely:", error2);
                });
            });
        }
    };

    /* =========================================================
       DEBUG
       ========================================================= */
    console.log("[DOD] DEMOCRACY OF THE DEAD Web System Ready");
    </script>

</body>
</html>
